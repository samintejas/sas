[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/samintejas/sas"
rust-version = "1.85"

[workspace.dependencies]
sat-time = { path = "crates/sat-time" }
sat-doc = { path = "crates/sat-doc" }
im = { version = "15", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
thiserror = "2"
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1
